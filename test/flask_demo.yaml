kubectl apply -f - <<'YAML'
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-demo-app
  namespace: default
data:
  app.py: |
    import logging
    import os
    import time
    from flask import Flask, Response

    from prometheus_client import Counter, Histogram, generate_latest, CONTENT_TYPE_LATEST

    app = Flask(__name__)

    # Make logs show up in stdout with level INFO/ERROR
    logging.basicConfig(
        level=os.getenv("LOG_LEVEL", "INFO"),
        format="%(asctime)s %(levelname)s %(name)s %(message)s",
    )
    log = logging.getLogger("flask-demo")

    REQ_COUNT = Counter("http_requests_total", "Total HTTP requests", ["path", "method", "status"])
    REQ_LAT = Histogram("http_request_duration_seconds", "Request latency", ["path"])

    @app.get("/")
    def hello():
      REQ_COUNT.labels(path="/", method="GET", status="200").inc()
      return "ok\n", 200

    @app.get("/error")
    def error():
      # generate an ERROR log to stdout
      log.error("Simulated ERROR for Loki ingestion: something bad happened")
      REQ_COUNT.labels(path="/error", method="GET", status="500").inc()
      return "error\n", 500

    @app.get("/slow")
    def slow():
      start = time.time()
      time.sleep(0.7)
      dur = time.time() - start
      REQ_LAT.labels(path="/slow").observe(dur)
      REQ_COUNT.labels(path="/slow", method="GET", status="200").inc()
      return f"slow {dur:.3f}s\n", 200

    @app.get("/metrics")
    def metrics():
      return Response(generate_latest(), mimetype=CONTENT_TYPE_LATEST)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-demo
  namespace: default
  labels:
    app: flask-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-demo
  template:
    metadata:
      labels:
        app: flask-demo
    spec:
      containers:
        - name: flask-demo
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: app
              mountPath: /app
          workingDir: /app
          command: ["/bin/sh","-lc"]
          # For lab use: install deps at start then run gunicorn
          args:
            - |
              python -V
              pip install --no-cache-dir flask gunicorn prometheus_client
              exec gunicorn -b 0.0.0.0:8080 --workers 1 --threads 4 app:app
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: app
          configMap:
            name: flask-demo-app

---
apiVersion: v1
kind: Service
metadata:
  name: flask-demo
  namespace: default
  labels:
    app: flask-demo
spec:
  selector:
    app: flask-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
YAML