apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-demo-prod
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: <YOUR_GIT_REPO_URL>
    targetRevision: main
    path: app/flask-demo
    helm:
      valueFiles:
        - values.yaml
        - envs/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
