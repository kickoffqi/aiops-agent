apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-demo-dev
  namespace: default
spec:
  project: platform
  source:
    repoURL: https://github.com/kickoffqi/aiops-agent
    targetRevision: main
    path: app/flask-demo
    helm:
      valueFiles:
        - values.yaml
        - envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
