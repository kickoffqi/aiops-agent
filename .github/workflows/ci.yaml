name: AIOps Post-Merge Sync

on:
  push:
    branches: ["main"]

jobs:
  post-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          pip install uv
          uv sync --frozen

      - name: Run post-merge sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          ARGOCD_APP_PROD: flask-demo-prod
          ARGOCD_INSECURE: "true"
        run: |
          uv run aiops post-merge --verify --out incident_report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: incident_report
          path: incident_report.json
